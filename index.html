<style>
  body { margin: 0; }
  .wj-btn { background: transparent; border: 0.5px solid var(--border-strong, #ccc); border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; color: var(--text-primary, #1a1a1a); }
  .wj-btn:hover { background: var(--surface-1, #f4f4f2); }
  .wj-btn:active { transform: scale(0.98); }
  .wj-btn-primary { background: #1a1a1a; color: #fff; border: none; }
  .wj-input, .wj-select { height: 36px; border: 0.5px solid var(--border-strong, #ccc); border-radius: 8px; padding: 0 10px; font-size: 14px; width: 100%; box-sizing: border-box; background: var(--surface-2, #fff); color: var(--text-primary, #1a1a1a); }
  .wj-card { background: var(--surface-2, #fff); border: 0.5px solid var(--border, #e5e5e0); border-radius: 12px; padding: 1rem 1.25rem; }
  .wj-label { font-size: 12px; color: var(--text-secondary, #666); margin-bottom: 4px; display: block; }
  .wj-row { display: flex; gap: 8px; }
  .wj-tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
  .wj-tab { flex: 1; min-width: 70px; text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border-strong, #ccc); }
  .wj-tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .ex-row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 0; border-bottom: 0.5px solid var(--border, #e5e5e0); }
  .ex-row:last-child { border-bottom: none; }
  .ex-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
  .ex-mini-label { font-size: 11px; color: var(--text-secondary, #666); }
  .cal-cell { aspect-ratio: 1 / 1; display:flex; flex-direction: column; align-items:center; justify-content:center; border-radius: 8px; font-size: 12px; cursor: default; position: relative; color: var(--text-primary,#1a1a1a); background: var(--surface-1,#f4f4f2); }
  .cal-cell.empty { background: transparent; }
  .cal-cell.trained { color: #fff; cursor: pointer; font-weight: 500; gap: 1px; }
  .cal-cell.selected { outline: 2px solid #1a1a1a; outline-offset: 1px; }
  .cal-cell.today-marker::after { content:''; position:absolute; bottom:2px; width:4px; height:4px; border-radius:50%; background: currentColor; opacity:0.7; }
  .cal-cell-day { line-height: 1; }
  .cal-cell-volume { font-size: 8.5px; font-weight: 400; line-height: 1; opacity: 0.9; }
  .ex-progress-row { display:flex; align-items:center; gap:10px; padding: 10px 0; border-bottom: 0.5px solid var(--border, #e5e5e0); }
  .ex-progress-row:last-child { border-bottom: none; }
  .ex-progress-info { flex: 1; min-width: 0; }
  .ex-progress-name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-progress-meta { font-size: 12px; color: var(--text-secondary, #666); margin-top: 2px; }
  .ex-progress-trend { font-size: 11px; margin-top: 4px; line-height: 1.5; }
  .ex-progress-chart-wrap { width: 80px; height: 46px; flex-shrink: 0; }
  .ex-progress-count { width: 36px; flex-shrink: 0; text-align: center; }
  .ex-progress-count-num { font-size: 19px; font-weight: 700; line-height: 1; }
  .ex-progress-count-label { font-size: 9px; color: var(--text-secondary, #666); margin-top: 1px; }
  .period-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
</style>
<div style="max-width: 720px; margin: 0 auto; font-family: system-ui, sans-serif; padding: 1rem 0;">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Журнал тренувань з програмою на 4 дні, редагуванням вправ, історією та графіком прогресу</h2>

  <div class="wj-tabs">

  <div id="view-log" style="display:none;">
    <div class="wj-row" style="margin-bottom: 10px; gap:8px;">

      <input type="date" class="wj-input" id="log-date" style="flex:1;" />

    <div id="log-recovery-banner" style="margin-bottom: 10px;"></div>
    <div class="wj-card" id="log-list" style="margin-bottom: 1rem;"></div>
    <div id="log-error" style="color: var(--text-danger, #c0392b); font-size: 13px; margin-bottom: 8px; display: none;"></div>
    <button class="wj-btn wj-btn-primary" id="btn-save-workout" style="width:100%;"><i class="ti ti-check" aria-hidden="true"></i> Закінчити тренування та зберегти</button>
  </div>

  <div id="view-history" style="display:none;">
    <div class="wj-card" style="margin-bottom: 1rem;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px;">
        <button class="wj-btn" id="btn-cal-prev" aria-label="Попередній місяць"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <div style="font-weight:500; font-size:14px;" id="cal-range-label">-</div>
        <button class="wj-btn" id="btn-cal-next" aria-label="Наступний місяць"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
      </div>

      <div id="cal-month-label-1" style="font-weight:500; font-size:13px; text-align:center; margin-bottom:6px; color: var(--text-secondary,#666);">-</div>
      <div id="cal-weekdays-1" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; font-size:11px; color: var(--text-secondary,#666); text-align:center; margin-bottom: 4px;"></div>
      <div id="cal-grid-1" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:4px;"></div>

      <div id="cal-month-label-2" style="font-weight:500; font-size:13px; text-align:center; margin: 16px 0 6px; color: var(--text-secondary,#666);">-</div>
      <div id="cal-weekdays-2" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; font-size:11px; color: var(--text-secondary,#666); text-align:center; margin-bottom: 4px;"></div>
      <div id="cal-grid-2" style="display:grid; grid-template-columns: repeat(7, 1fr); gap:4px;"></div>

      <div id="cal-legend" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;"></div>
    </div>
    <div id="history-list"></div>
  </div>

  <div id="view-progress" style="display:none;">
    <div class="wj-card" style="margin-bottom: 1rem;">
      <div style="font-weight:500; font-size:15px; margin-bottom: 10px;">Кількість тренувань по групах</div>
      <div id="training-count-list" style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px;"></div>
    </div>

    <div class="wj-card" style="margin-bottom: 1rem;">

        <div style="font-weight:500; font-size:15px;">Прогрес по вправах</div>
        <div style="display:flex; gap:4px;" id="period-switcher">
          <button class="wj-btn period-btn" data-period="1m" style="padding:4px 8px; font-size:12px;">Місяць</button>

        </div>
      </div>
      <div id="exercise-progress-list"></div>
    </div>
  </div>
</div>

  async function loadData(){
    let storedVersion = 0;
    try {
      const vRes = await storage.get(PROGRAM_VERSION_KEY, false);
      storedVersion = vRes && vRes.value ? parseInt(vRes.value) : 0;
    } catch(e){ storedVersion = 0; }

    try {
      const res = await storage.get(PROGRAM_KEY, false);
      program = res && res.value ? JSON.parse(res.value) : null;
    } catch(e){ program = null; }

    if(!program || storedVersion < PROGRAM_VERSION){
      program = JSON.parse(JSON.stringify(DEFAULT_PROGRAM));
      await saveProgram();
      try { await storage.set(PROGRAM_VERSION_KEY, String(PROGRAM_VERSION), false); }
      catch(e){ console.error('Помилка збереження версії програми', e); }
    }
    try {
      const res2 = await storage.get(ENTRIES_KEY, false);
      entries = res2 && res2.value ? JSON.parse(res2.value) : [];
    } catch(e){ entries = []; }

    let seedVersion = 0;
    try {
      const sRes = await storage.get(ENTRIES_SEED_KEY, false);
      seedVersion = sRes && sRes.value ? parseInt(sRes.value) : 0;
    } catch(e){ seedVersion = 0; }
    if(seedVersion < ENTRIES_SEED_VERSION){
      entries = entries.concat(SEED_ENTRIES);
      entries.sort((a,b)=> a.date.localeCompare(b.date));
      await saveEntries();
      try { await storage.set(ENTRIES_SEED_KEY, String(ENTRIES_SEED_VERSION), false); }
      catch(e){ console.error('Помилка збереження версії посіву записів', e); }
    }

    // Одноразове виправлення назв вправ, які зберігались із різним написанням
    // (напр. "Жим у хамері" vs "Жим в хамері") — обʼєднуємо в одну вправу.
    const NAME_FIXES_VERSION = 1;
    const NAME_FIXES_KEY = 'name_fixes_version';
    const NAME_FIXES = [
      ['Жим у хамері над головою', 'Жим в хамері над головою']
    ];
    let nameFixVersion = 0;
    try {
      const nfRes = await storage.get(NAME_FIXES_KEY, false);
      nameFixVersion = nfRes && nfRes.value ? parseInt(nfRes.value) : 0;
    } catch(e){ nameFixVersion = 0; }
    if(nameFixVersion < NAME_FIXES_VERSION){
      let changed = false;
      NAME_FIXES.forEach(([from, to]) => {
        entries.forEach(e => {
          if(e.exercise === from){ e.exercise = to; changed = true; }
        });
      });
      if(changed) await saveEntries();
      try { await storage.set(NAME_FIXES_KEY, String(NAME_FIXES_VERSION), false); }
      catch(e){ console.error('Помилка збереження версії виправлення назв', e); }
    }

    // Одноразове перейменування днів програми у вже збережених записах
    // (напр. "День 1" → "Ноги")
    const DAY_RENAME_VERSION = 1;
    const DAY_RENAME_KEY = 'day_rename_version';
    const DAY_RENAMES = [
      ['День 1', 'Ноги'],
      ['День 2', 'Груди Біцепс'],
      ['День 3', 'Легкі ноги Дельти'],
      ['День 4', 'Спина Трицепс']
    ];
    let dayRenameVersion = 0;
    try {
      const drRes = await storage.get(DAY_RENAME_KEY, false);
      dayRenameVersion = drRes && drRes.value ? parseInt(drRes.value) : 0;
    } catch(e){ dayRenameVersion = 0; }
    if(dayRenameVersion < DAY_RENAME_VERSION){
      let changed = false;
      DAY_RENAMES.forEach(([from, to]) => {
        entries.forEach(e => {
          if(e.day === from){ e.day = to; changed = true; }
        });
      });
      if(changed) await saveEntries();
      try { await storage.set(DAY_RENAME_KEY, String(DAY_RENAME_VERSION), false); }
      catch(e){ console.error('Помилка збереження версії перейменування днів', e); }
    }

    renderAll();
  }

  function groupRecoveryStatus(group){
    const sessionsForGroup = {};
    entries.forEach(e => {
      if(getMuscleGroup(e.exercise) === group){
        if(!sessionsForGroup[e.date]) sessionsForGroup[e.date] = { volume: 0, rpeSum: 0, rpeCount: 0 };
        sessionsForGroup[e.date].volume += e.weight * e.sets * e.reps;
        if(e.rpe){ sessionsForGroup[e.date].rpeSum += e.rpe; sessionsForGroup[e.date].rpeCount += 1; }
      }
    });
    const dates = Object.keys(sessionsForGroup).sort();
    if(dates.length === 0) return { trained: false };

    const lastDate = dates[dates.length - 1];
    const lastData = sessionsForGroup[lastDate];
    const histVolumes = dates.slice(0, -1).map(d => sessionsForGroup[d].volume);
    const avgHist = histVolumes.length ? histVolumes.reduce((a,b)=>a+b,0) / histVolumes.length : null;

    const base = RECOVERY_BASE_HOURS[group] || RECOVERY_BASE_HOURS['Інше'];
    let hours = (base[0] + base[1]) / 2;
    if(avgHist !== null && avgHist > 0){
      if(lastData.volume > avgHist * 1.1) hours = base[1];
      else if(lastData.volume < avgHist * 0.9) hours = base[0];
    }
    const avgRpe = lastData.rpeCount > 0 ? lastData.rpeSum / lastData.rpeCount : null;
    if(avgRpe !== null){
      if(avgRpe >= 8) hours = Math.min(base[1] + 12, hours + 12);
      else if(avgRpe <= 5) hours = Math.max(base[0] - 6, hours - 6);
    }
    hours = Math.round(hours / 6) * 6;

    const readyDate = new Date(lastDate + 'T00:00:00');
    readyDate.setHours(readyDate.getHours() + hours);
    const now = new Date();
    const remainingMs = readyDate - now;
    const remainingHours = Math.max(0, Math.ceil(remainingMs / (1000*60*60)));

    return { trained: true, lastDate, ready: remainingMs <= 0, remainingHours, readyDate };
  }

  function buildMonthGrid(year, month, suffix, dateToDay, dateToVolume, colorMap, todayIso){
    document.getElementById('cal-month-label-'+suffix).textContent = `${MONTH_NAMES_UK[month]} ${year}`;

    const wd = document.getElementById('cal-weekdays-'+suffix);
    wd.innerHTML = WEEKDAYS_UK.map(w => `<div>${w}</div>`).join('');

    function formatVolume(v){
      const r = Math.round(v);
      if(r >= 1000) return (r/1000).toFixed(1).replace(/\.0$/, '') + 'к';
      return String(r);
    }

    const firstOfMonth = new Date(year, month, 1);
    let startWeekday = firstOfMonth.getDay(); // 0=Нд
    startWeekday = (startWeekday + 6) % 7; // зсув так, щоб Пн=0
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const grid = document.getElementById('cal-grid-'+suffix);
    let html = '';
    for(let i=0; i<startWeekday; i++){ html += '<div class="cal-cell empty"></div>'; }
    for(let d=1; d<=daysInMonth; d++){
      const iso = `${year}-${pad2(month+1)}-${pad2(d)}`;
      const dayType = dateToDay[iso];
      const isToday = iso === todayIso;
      const isSelected = iso === selectedCalDate;
      if(dayType){
        const color = colorMap[dayType];
        const textColor = (dayType === 'Груди Біцепс') ? '#3a2e00' : '#fff';
        const volLabel = formatVolume(dateToVolume[iso]);
        html += `<div class="cal-cell trained${isToday ? ' today-marker' : ''}${isSelected ? ' selected' : ''}" style="background:${color}; color:${textColor};" data-date="${iso}"><span class="cal-cell-day">${d}</span><span class="cal-cell-volume">${volLabel}</span></div>`;
      } else {
        html += `<div class="cal-cell${isToday ? ' today-marker' : ''}" data-date="${iso}">${d}</div>`;
      }
    }
    grid.innerHTML = html;

    grid.querySelectorAll('.cal-cell.trained').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        selectedCalDate = cell.getAttribute('data-date');
        renderHistory();
      });
    });
  }

  function renderHistory(){
    initCalendarCursor();
    const colorMap = getDayColorMap();
    const { year, month } = calendarCursor; // calendarCursor = пізніший (правий) місяць

    let prevYear = year, prevMonth = month - 1;
    if(prevMonth < 0){ prevMonth = 11; prevYear -= 1; }

    document.getElementById('cal-range-label').textContent = `${MONTH_NAMES_UK[prevMonth]} ${prevYear} — ${MONTH_NAMES_UK[month]} ${year}`;

    // Дата -> запис програмного дня (перший запис цієї дати) та обʼєм тренування
    const dateToDay = {};
    const dateToVolume = {};
    entries.forEach(e=>{
      if(!dateToDay[e.date]) dateToDay[e.date] = e.day || 'Без назви';
      dateToVolume[e.date] = (dateToVolume[e.date] || 0) + e.weight * e.sets * e.reps;
    });

    const todayIso = todayStr();

    buildMonthGrid(prevYear, prevMonth, '1', dateToDay, dateToVolume, colorMap, todayIso);
    buildMonthGrid(year, month, '2', dateToDay, dateToVolume, colorMap, todayIso);

    const legend = document.getElementById('cal-legend');
    legend.innerHTML = Object.entries(colorMap).map(([day, color]) => `
      <div style="display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-secondary,#666);">
        <span style="width:10px; height:10px; border-radius:3px; background:${color}; display:inline-block;"></span>${escapeHtml(day)}
      </div>
    `).join('');

    renderSelectedDayDetails();
  }

  function renderSelectedDayDetails(){
    const list = document.getElementById('history-list');
    if(!selectedCalDate){
      const dates = sessionDates();
      if(dates.length === 0){
        list.innerHTML = '<p style="color:var(--text-secondary,#666); font-size:14px; text-align:center; padding: 2rem 0;">Записів поки немає.</p>';
      } else {
        list.innerHTML = '<p style="color:var(--text-secondary,#666); font-size:14px; text-align:center; padding: 1rem 0;">Оберіть кольорову дату в календарі, щоб побачити деталі тренування.</p>';
      }
      return;
    }
    const dayEntries = entries.filter(e => e.date === selectedCalDate);
    if(dayEntries.length === 0){
      list.innerHTML = '';
      return;
    }
    const dayLabel = dayEntries[0].day || 'Без назви';
    const totalVol = Math.round(volumeForEntries(dayEntries));
    list.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div style="font-weight:500; font-size:15px;">${escapeHtml(dayLabel)} · ${selectedCalDate}</div>
        <div style="font-size:13px; color:var(--text-secondary,#666);">Обʼєм: ${totalVol} кг</div>
      </div>
    ` + dayEntries.map(e => `
      <div class="wj-card" style="margin-bottom: 8px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div>
          <div style="font-weight:500; font-size:15px;">${escapeHtml(e.exercise)}</div>
          <div style="font-size:13px; color:var(--text-secondary,#666); margin-top:2px;">${e.weight} кг × ${e.sets}×${escapeHtml(e.repsLabel || String(e.reps))}${e.rpe ? ' · RPE ' + e.rpe : ''}</div>
          ${e.notes ? `<div style="font-size:13px; color:var(--text-secondary,#666); margin-top:4px;">${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <button class="wj-btn" data-id="${e.id}" aria-label="Видалити запис" style="flex-shrink:0; padding: 6px 10px;"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    `).join('');
    list.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = parseInt(btn.getAttribute('data-id'));
        entries = entries.filter(e => e.id !== id);
        await saveEntries();
        renderAll();
      });
    });
  }

  let exerciseChartInstances = [];
  let progressPeriod = 'all';

  function slugify(name){
    return 'exch-' + (name || 'unnamed').toLowerCase()
      .replace(/[^a-zа-яіїєґ0-9]+/gi, '-')
      .replace(/^-+|-+$/g, '') + '-' + Math.abs(hashCode(name || ''));
  }
  function hashCode(str){
    let h = 0;
    for(let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return h;
  }

  function periodCutoffDate(){
    if(progressPeriod === 'all') return null;
    const months = progressPeriod === '1m' ? 1 : 3;
    const d = new Date();
    d.setMonth(d.getMonth() - months);
    return d.toISOString().slice(0,10);
  }

  document.querySelectorAll('.period-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      progressPeriod = btn.getAttribute('data-period');
      document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderProgress();
      renderTrainingCounts();
    });
  });

  let dayCountChartInstances = [];

  function renderTrainingCounts(){
    dayCountChartInstances.forEach(c => c.destroy());
    dayCountChartInstances = [];

    const container = document.getElementById('training-count-list');
    if(!container) return;
    const colorMap = getDayColorMap();
    const cutoff = periodCutoffDate();
    const filtered = cutoff ? entries.filter(e => e.date >= cutoff) : entries;

    const datesByDay = {};
    const volumeByDayDate = {};
    filtered.forEach(e=>{
      const d = e.day || 'Без назви';
      if(!datesByDay[d]) datesByDay[d] = new Set();
      datesByDay[d].add(e.date);
      if(!volumeByDayDate[d]) volumeByDayDate[d] = {};
      volumeByDayDate[d][e.date] = (volumeByDayDate[d][e.date] || 0) + e.weight * e.sets * e.reps;
    });

    const days = dayNames().length ? dayNames() : Object.keys(datesByDay).sort();

    if(days.length === 0){
      container.innerHTML = '<p style="color:var(--text-secondary,#666); font-size:14px; text-align:center; padding: 1rem 0; grid-column: 1 / -1;">Немає даних.</p>';
      return;
    }

    container.innerHTML = days.map(day => {
      const count = datesByDay[day] ? datesByDay[day].size : 0;
      const color = colorMap[day] || '#378ADD';
      const id = slugify(day);
      return `
        <div style="border-radius: 10px; padding: 12px; background: ${color}1a; border: 1px solid ${color}55;">
          <div style="font-size:12px; color: var(--text-secondary,#666); margin-bottom:4px;">${escapeHtml(day)}</div>
          <div style="display:flex; align-items:baseline; gap:4px; margin-bottom:6px;">
            <span style="font-size:26px; font-weight:700; color:${color};">${count}</span>
            <span style="font-size:12px; color: var(--text-secondary,#666);">трен.</span>
          </div>
          <div style="position:relative; height:34px;"><canvas id="daycount-chart-${id}"></canvas></div>
        </div>
      `;
    }).join('');

    days.forEach(day => {
      const id = slugify(day);
      const color = colorMap[day] || '#378ADD';
      const volMap = volumeByDayDate[day] || {};
      const sortedDates = Object.keys(volMap).sort();
      const canvas = document.getElementById('daycount-chart-'+id);
      if(!canvas || sortedDates.length === 0) return;

      const chart = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: sortedDates,
          datasets: [{
            data: sortedDates.map(d => Math.round(volMap[d])),
            borderColor: color,
            backgroundColor: color + '33',
            tension: 0.3,
            fill: true,
            pointRadius: 0,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: { y: { display: false }, x: { display: false } }
        }
      });
      dayCountChartInstances.push(chart);
    });
  }

  function renderProgress(){
    exerciseChartInstances.forEach(c => c.destroy());
    exerciseChartInstances = [];

    const container = document.getElementById('exercise-progress-list');
    const cutoff = periodCutoffDate();
    const colorMap = getDayColorMap();
    const allNames = allExerciseNames().filter(name => entries.some(e => e.exercise === name));
    const names = cutoff
      ? allNames.filter(name => entries.some(e => e.exercise === name && e.date >= cutoff))
      : allNames;

    if(allNames.length === 0){
      container.innerHTML = '<p style="color:var(--text-secondary,#666); font-size:14px; text-align:center; padding: 1rem 0;">Записів поки немає — почни тренування, щоб побачити прогрес.</p>';
      return;
    }
    if(names.length === 0){
      container.innerHTML = '<p style="color:var(--text-secondary,#666); font-size:14px; text-align:center; padding: 1rem 0;">Немає тренувань за обраний період.</p>';
      return;
    }

    container.innerHTML = names.map(name => {
      const id = slugify(name);
      return `
        <div class="ex-progress-row">
          <div class="ex-progress-info">
            <div class="ex-progress-name">${escapeHtml(name)}</div>
            <div class="ex-progress-meta" id="meta-${id}">-</div>
            <div class="ex-progress-trend" id="trend-${id}"></div>
          </div>
          <div class="ex-progress-count" id="count-${id}"></div>
          <div class="ex-progress-chart-wrap"><canvas id="chart-${id}"></canvas></div>
        </div>
      `;
    }).join('');

    names.forEach(name => {
      const id = slugify(name);
      const fullData = entries.filter(e => e.exercise === name).sort((a,b)=>a.date.localeCompare(b.date));
      const chartData = cutoff ? fullData.filter(e => e.date >= cutoff) : fullData;
      const maxWeight = Math.max(...fullData.map(e=>e.weight));
      document.getElementById('meta-'+id).textContent = `Макс: ${maxWeight} кг`;
      document.getElementById('trend-'+id).innerHTML = buildTrendHtml(fullData);

      const lastDay = fullData.length ? fullData[fullData.length-1].day : null;
      const badgeColor = (lastDay && colorMap[lastDay]) ? colorMap[lastDay] : '#378ADD';
      document.getElementById('count-'+id).innerHTML = `
        <div class="ex-progress-count-num" style="color:${badgeColor};">${fullData.length}</div>
        <div class="ex-progress-count-label">трен.</div>
      `;

      const ctx = document.getElementById('chart-'+id).getContext('2d');
      if(chartData.length === 0){
        // період без даних для цієї вправи — лишаємо порожній канвас
        return;
      }
      const chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: chartData.map(e=>e.date),
          datasets: [{
            data: chartData.map(e=>e.weight),
            borderColor: '#378ADD',
            backgroundColor: 'rgba(55,138,221,0.12)',
            tension: 0.3,
            fill: true,
            pointRadius: 0,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: true } },
          scales: {
            y: { display: false },
            x: { display: false }
          }
        }
      });
      exerciseChartInstances.push(chart);
    });
  }

  function trendChip(label, delta, unit, isPercent){
    let arrow = '→', color = '#888';
    if(delta > 0){ arrow = '↑'; color = '#2e9e5b'; }
    else if(delta < 0){ arrow = '↓'; color = '#c0392b'; }
    const roundedDelta = Math.round(Math.abs(delta) * 10) / 10;
    const valueStr = delta === 0 ? 'без змін' : `${delta > 0 ? '+' : '-'}${roundedDelta}${unit}`;
    return `<span style="color:${color};">${label}: ${arrow} ${valueStr}</span>`;
  }

  function buildTrendHtml(data){
    if(data.length < 2) return '<span style="color:var(--text-secondary,#666);">Ще недостатньо даних для тренду</span>';
    const last = data[data.length-1];
    const prev = data[data.length-2];
    const lastVolume = last.weight * last.sets * last.reps;
    const prevVolume = prev.weight * prev.sets * prev.reps;
    const volumeDelta = prevVolume > 0 ? Math.round(((lastVolume - prevVolume) / prevVolume) * 1000) / 10 : 0;

    const chips = [
      trendChip('Вага', last.weight - prev.weight, ' кг'),
      trendChip('Підходи', last.sets - prev.sets, ''),
      trendChip('Повтори', last.reps - prev.reps, ''),
      trendChip('Обʼєм', volumeDelta, '%')
    ];
    return chips.join(' · ');
  }

  // --- Групи мʼязів та відновлення ---
  function getMuscleGroup(name){
    const n = (name || '').toLowerCase();
    if(n.includes('ікри') || n.includes('литк')) return 'Литки';
    if(n.includes('біцепс') || n.includes('трицепс') || n.includes('французьк') || n.includes('канат')) return 'Руки';
    if(n.includes('плеч') || n.includes('махи в сторони') || n.includes('над головою')) return 'Плечі';
    if(n.includes('тяга') || n.includes('пуловер') || n.includes('гіперекстензія') || n.includes('шраги') || n.includes('face pull') || n.includes('фейс пул')) return 'Спина';
    if(n.includes('присід') || n.includes('випад') || n.includes('жим ногами') || n.includes('згинання ніг') || n.includes('розгинання ніг') || n.includes('рум')) return 'Ноги';
    if(n.includes('жим') || n.includes('бруси') || n.includes('кросовер') || n.includes('пекдек')) return 'Груди';
    if(n.includes('прес') || n.includes('кор')) return 'Кор';
    return 'Інше';
  }

  const RECOVERY_BASE_HOURS = {
    'Ноги': [48, 72],
    'Груди': [40, 60],
    'Спина': [40, 60],
    'Плечі': [24, 48],
    'Руки': [24, 36],
    'Литки': [20, 30],
    'Кор': [20, 30],
    'Інше': [24, 48]
  };

  function sessionDates(){
    return [...new Set(entries.map(e=>e.date))].sort();
  }

  function volumeForEntries(list){
    return list.reduce((sum, e) => sum + (e.weight * e.sets * e.reps), 0);
  }

  function renderAll(){
    fillDaySelects();
    renderProgram();
    renderLog();
    renderHistory();
    renderProgress();
    renderTrainingCounts();
  }

  loadData();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
